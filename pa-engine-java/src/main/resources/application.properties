spring.application.name=pa-engine-java
server.port=8081

# Model used for live runs. Claude Opus 5.5 is the default; medium effort is its default.
payerai.model=claude-opus-5-5
# Live runs allowed per client IP per day.
payerai.daily-limit=10
# If ANTHROPIC_API_KEY isn't set in the environment, read it from this project's .env file.
payerai.env-file=../.env

management.endpoints.web.exposure.include=health
